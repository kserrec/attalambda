name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # The printing milestone has 45 files and 17,064 assertions. Its merge
    # passed in 18m22s; a documentation-only run reached the 20-minute cap
    # after all assertions passed, before the final structural checks finished.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          distribution: full
          version: '9.3'
          variant: CS

      - name: Verify bundled lazy package
        run: racket -e '(require lazy)'

      - name: Run test suite
        run: |
          set -euo pipefail
          suite_log="$RUNNER_TEMP/attalambda-test-suite.log"
          ./run-all-tests.sh | tee "$suite_log"
          [[ "$(tail -n 1 "$suite_log")" =~ ^All\ [1-9][0-9]*\ test\ files\ passed[.]$ ]]

  linux-distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          distribution: full
          version: '9.3'
          variant: CS

      - name: Build final Linux release archive
        run: ./tooling/build-linux-distribution.sh "$RUNNER_TEMP/attalambda-artifacts"

      - name: Test transferred archive without Racket
        run: |
          set -euo pipefail
          consumer_log="$RUNNER_TEMP/attalambda-linux-consumer.log"
          ./tooling/test-linux-distribution.sh \
            "$RUNNER_TEMP/attalambda-artifacts" | tee "$consumer_log"
          [[ "$(tail -n 1 "$consumer_log")" == "consumer_acceptance=passed" ]]

  macos-distribution-build:
    name: macOS build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x86_64
            runner: macos-15-intel
            racket-architecture: x64
          - target: macos-arm64
            runner: macos-15
            racket-architecture: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          architecture: ${{ matrix.racket-architecture }}
          distribution: full
          version: '9.3'
          variant: CS

      - name: Build final native macOS release archive
        run: |
          mkdir -p "$RUNNER_TEMP/attalambda-transfer"
          ./tooling/build-macos-distribution.sh \
            "${{ matrix.target }}" \
            "$RUNNER_TEMP/attalambda-transfer"
          install -m 0555 \
            ./tooling/test-macos-distribution.sh \
            "$RUNNER_TEMP/attalambda-transfer/consumer.sh"

      - name: Transfer final-but-unpublished release archive to its consumer job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attalambda-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/attalambda-transfer/*.tar.gz
            ${{ runner.temp }}/attalambda-transfer/SHA256SUMS
            ${{ runner.temp }}/attalambda-transfer/consumer.sh
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          # One day is only an immediate-cleanup failure fallback.
          retention-days: 1

  macos-distribution-consumer:
    name: macOS consumer (${{ matrix.target }})
    needs: macos-distribution-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15

    steps:
      - name: Receive only the transferred release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attalambda-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/attalambda-transfer

      - name: Test without Racket or a source checkout
        run: |
          set -euo pipefail
          chmod 0555 "$RUNNER_TEMP/attalambda-transfer/consumer.sh"
          consumer_log="$RUNNER_TEMP/attalambda-${{ matrix.target }}-consumer.log"
          "$RUNNER_TEMP/attalambda-transfer/consumer.sh" \
            "$RUNNER_TEMP/attalambda-transfer" \
            "${{ matrix.target }}" | tee "$consumer_log"
          [[ "$(tail -n 1 "$consumer_log")" == "consumer_acceptance=passed" ]]

  macos-distribution-artifact-cleanup:
    name: Delete temporary macOS transfer artifacts
    needs:
      - macos-distribution-build
      - macos-distribution-consumer
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: none

    steps:
      - name: Delete both temporary workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for target in macos-x86_64 macos-arm64; do
            artifact_name="attalambda-$target-$GITHUB_SHA"
            artifact_id="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id")"
            if [[ -n "$artifact_id" ]]; then
              [[ "$artifact_id" != *$'\n'* ]]
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            fi
          done
          remaining_ids="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(
              .name == \"attalambda-macos-x86_64-$GITHUB_SHA\" or
              .name == \"attalambda-macos-arm64-$GITHUB_SHA\") | .id")"
          [[ -z "$remaining_ids" ]]

  windows-distribution-build:
    name: Windows x86-64 build
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Install native Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          architecture: x64
          distribution: full
          version: '9.3'
          variant: CS

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build final native Windows release archive
        shell: pwsh
        run: |
          $transfer = Join-Path $env:RUNNER_TEMP 'attalambda-transfer'
          [IO.Directory]::CreateDirectory($transfer) | Out-Null
          & .\tooling\build-windows-distribution.ps1 $transfer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [IO.File]::Copy(
            (Join-Path $PWD 'tooling\test-windows-distribution.ps1'),
            (Join-Path $transfer 'consumer.ps1'),
            $false)

      - name: Transfer final-but-unpublished release archive to its consumer job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attalambda-windows-x86_64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/attalambda-transfer/*.zip
            ${{ runner.temp }}/attalambda-transfer/SHA256SUMS
            ${{ runner.temp }}/attalambda-transfer/consumer.ps1
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          # One day is only an immediate-cleanup failure fallback.
          retention-days: 1

  windows-distribution-consumer:
    name: Windows x86-64 consumer
    needs: windows-distribution-build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      actions: read

    steps:
      - name: Receive only the transferred release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attalambda-windows-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/attalambda-transfer

      - name: Test without Racket or a source checkout
        shell: pwsh
        run: |
          $consumerCompletion = @(
            & "$env:RUNNER_TEMP\attalambda-transfer\consumer.ps1" "$env:RUNNER_TEMP\attalambda-transfer"
          )
          $consumerStatus = $LASTEXITCODE
          $consumerCompletion | ForEach-Object { Write-Output $_ }
          if ($consumerStatus -ne 0) { exit $consumerStatus }
          if ($consumerCompletion.Count -ne 1 -or
              $consumerCompletion[0] -cne 'consumer_acceptance=passed') {
            throw 'distribution consumer did not report successful completion'
          }

  windows-distribution-artifact-cleanup:
    name: Delete temporary Windows transfer artifact
    needs:
      - windows-distribution-build
      - windows-distribution-consumer
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: none

    steps:
      - name: Delete the temporary workflow artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="attalambda-windows-x86_64-$GITHUB_SHA"
          artifact_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id")"
          if [[ -n "$artifact_id" ]]; then
            [[ "$artifact_id" != *$'\n'* ]]
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          fi
          remaining_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id")"
          [[ -z "$remaining_id" ]]
